<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق وصلة | الحقيقي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { primary: '#6366f1', secondary: '#ec4899', dark: '#0f172a', surface: '#1e293b' },
                    fontFamily: { sans: ['Tajawal', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { -webkit-tap-highlight-color: transparent; font-family: 'Tajawal', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); }
        .dark .glass { background: rgba(30, 41, 59, 0.9); }
        /* Real Logic Styles */
        .hidden { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900 dark:bg-dark dark:text-white transition-colors duration-300 min-h-screen pb-24">

    <!-- Header -->
    <header class="fixed top-0 w-full z-40 glass border-b border-gray-200 dark:border-gray-800 shadow-sm">
        <div class="container mx-auto px-4 h-16 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center text-white font-bold text-xl shadow-lg">و</div>
                <div>
                    <h1 class="text-lg font-bold leading-none">وصلة <span class="text-xs text-primary bg-primary/10 px-1 rounded">الحقيقي</span></h1>
                </div>
            </div>
            <button onclick="toggleTheme()" class="w-10 h-10 rounded-full bg-gray-200 dark:bg-gray-800 flex items-center justify-center text-gray-600 dark:text-yellow-400">
                <i class="fas fa-moon dark:hidden"></i><i class="fas fa-sun hidden dark:block"></i>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto pt-24 px-4 space-y-6">

        <!-- 1. REAL DOWNLOADER GATEWAY -->
        <section id="downloader" class="space-y-4">
            <div class="bg-white dark:bg-surface p-6 rounded-3xl shadow-xl border border-gray-200 dark:border-gray-700 relative overflow-hidden">
                <div class="absolute top-0 right-0 w-32 h-32 bg-primary/10 rounded-bl-full -mr-10 -mt-10"></div>
                
                <h2 class="text-xl font-bold mb-4 relative z-10">تحميل حقيقي <span class="text-xs font-normal text-gray-500">(بوابة مباشرة)</span></h2>
                
                <div class="relative z-10 space-y-4">
                    <div class="flex items-center gap-2 bg-gray-50 dark:bg-dark/50 border border-gray-300 dark:border-gray-600 rounded-xl px-4 py-3">
                        <i class="fas fa-link text-gray-400"></i>
                        <input type="url" id="realUrlInput" placeholder="ضع رابط الفيديو هنا (تيك توك، يوتيوب..)" 
                            class="bg-transparent border-none outline-none w-full text-sm dark:text-white dir-ltr text-left">
                        <button onclick="pasteLink()" class="text-primary text-xs font-bold">لصق</button>
                    </div>

                    <!-- Service Selector (Real Redirects) -->
                    <div class="grid grid-cols-2 gap-2 text-xs">
                        <button onclick="setService('general')" id="srv-general" class="service-btn active bg-primary text-white py-2 rounded-lg border border-transparent">شامل (كل المواقع)</button>
                        <button onclick="setService('tiktok')" id="srv-tiktok" class="service-btn bg-gray-200 dark:bg-gray-700 dark:text-gray-300 py-2 rounded-lg border border-transparent">تيك توك (بدون علامة)</button>
                    </div>

                    <button onclick="executeRealDownload()" class="w-full bg-gradient-to-r from-primary to-secondary text-white font-bold py-4 rounded-xl shadow-lg hover:shadow-primary/50 transition-all transform active:scale-95 flex items-center justify-center gap-2">
                        <span>جلب الفيديو الآن</span>
                        <i class="fas fa-arrow-left"></i>
                    </button>
                    
                    <p class="text-[10px] text-gray-500 text-center">
                        * تنويه تقني: سيتم فتح الفيديو في سيرفر المعالجة مباشرة لتخطي حماية المتصفح.
                    </p>
                </div>
            </div>
        </section>

        <!-- 2. REAL SPEED TEST -->
        <section class="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-bold flex items-center gap-2"><i class="fas fa-tachometer-alt text-green-500"></i> قياس السرعة الحقيقي</h3>
                <span id="speed-status" class="text-xs text-gray-400">جاهز</span>
            </div>
            <div class="flex items-end gap-2 mb-3">
                <span id="speed-result" class="text-4xl font-black font-mono">0.00</span>
                <span class="text-sm text-gray-500 mb-2">Mbps</span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2 mb-4 overflow-hidden">
                <div id="speed-bar" class="bg-green-500 h-full w-0 transition-all duration-300"></div>
            </div>
            <button onclick="startRealSpeedTest()" class="w-full py-2 bg-gray-100 dark:bg-gray-700 rounded-lg text-sm font-bold">ابدأ القياس الفعلي</button>
        </section>

        <!-- 3. REAL LINK CLEANER -->
        <section class="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
            <h3 class="font-bold flex items-center gap-2 mb-3"><i class="fas fa-broom text-orange-500"></i> تنظيف الروابط (فعلي)</h3>
            <div class="space-y-3">
                <textarea id="dirty-link" rows="2" class="w-full bg-gray-50 dark:bg-dark p-3 rounded-xl text-xs font-mono outline-none border focus:border-orange-500" placeholder="الصق الرابط الطويل المليء بأكواد التتبع هنا..."></textarea>
                <div class="flex gap-2">
                    <button onclick="cleanLinkReal()" class="flex-1 py-2 bg-orange-500 text-white rounded-lg text-sm font-bold">نظف الرابط</button>
                    <button onclick="copyCleanLink()" class="px-4 py-2 bg-gray-200 dark:bg-gray-700 rounded-lg text-sm"><i class="fas fa-copy"></i></button>
                </div>
            </div>
        </section>

        <!-- 4. REAL HASHTAG GENERATOR -->
        <section class="bg-white dark:bg-surface p-5 rounded-2xl shadow-sm border border-gray-200 dark:border-gray-700">
             <h3 class="font-bold flex items-center gap-2 mb-3"><i class="fas fa-hashtag text-blue-500"></i> مولد هاشتاجات ذكي</h3>
             <input type="text" id="tag-topic" placeholder="موضوع الفيديو (مثلاً: كرة قدم)" class="w-full p-2 mb-2 rounded-lg border dark:bg-dark dark:border-gray-600 text-sm">
             <div id="tags-output" class="text-xs text-blue-500 bg-blue-50 dark:bg-dark/50 p-3 rounded-lg min-h-[50px] dir-ltr text-left select-all"></div>
             <button onclick="generateTagsReal()" class="mt-2 w-full py-2 bg-blue-500 text-white rounded-lg text-xs font-bold">توليد</button>
        </section>

    </main>

    <!-- JS Logic -->
    <script>
        // --- 1. Real Theme Logic ---
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }
        if(localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');

        // --- 2. Real Download Gateway Logic ---
        let currentService = 'general';
        
        function setService(srv) {
            currentService = srv;
            document.querySelectorAll('.service-btn').forEach(b => {
                b.classList.remove('bg-primary', 'text-white');
                b.classList.add('bg-gray-200', 'dark:bg-gray-700', 'dark:text-gray-300');
            });
            const active = document.getElementById(`srv-${srv}`);
            active.classList.add('bg-primary', 'text-white');
            active.classList.remove('bg-gray-200', 'dark:bg-gray-700');
        }

        async function pasteLink() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('realUrlInput').value = text;
            } catch(e) { alert('يرجى اللصق يدوياً'); }
        }

        function executeRealDownload() {
            const url = document.getElementById('realUrlInput').value.trim();
            if (!url) return alert('أدخل الرابط أولاً!');

            // هذا هو الجزء الحقيقي: التوجيه لخدمات معالجة فعلية
            let gatewayUrl = '';
            
            // تنظيف الرابط أولاً
            const cleanUrl = url.split('?')[0]; 
            const encodedUrl = encodeURIComponent(url);

            if (currentService === 'tiktok' && url.includes('tiktok')) {
                // استخدام بوابة Snaptik أو TikWM (خدمات حقيقية)
                gatewayUrl = `https://tikwm.com/`; // يفتح الموقع للمستخدم
                // أو نستخدم خدعة البحث في جوجل
                window.open(`https://snaptik.app/ar?url=${encodedUrl}`, '_blank');
                return;
            } else {
                // بوابة شاملة (SaveFrom أو Publer)
                // نفتح نافذة جديدة بها الرابط جاهز للتحميل
                gatewayUrl = `https://savefrom.net/${cleanUrl}`;
            }

            // فتح البوابة في تبويب جديد
            const win = window.open(gatewayUrl, '_blank');
            if(win) win.focus();
            else alert('يرجى السماح بالنوافذ المنبثقة للتحميل');
        }

        // --- 3. Real Speed Test Logic (Image Download) ---
        function startRealSpeedTest() {
            const resultEl = document.getElementById('speed-result');
            const bar = document.getElementById('speed-bar');
            const status = document.getElementById('speed-status');
            
            status.textContent = "جاري الاتصال...";
            bar.style.width = "10%";
            resultEl.textContent = "0.00";

            // صورة اختبارية من سيرفر سريع (ويكيبيديا) حجمها معروف تقريباً
            const imageAddr = "https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg"; 
            const downloadSize = 2000000; // تقريبي بالبايت (2MB)
            const startTime = (new Date()).getTime();
            const cacheBuster = "?nnn=" + startTime;

            const download = new Image();
            
            download.onload = function () {
                const endTime = (new Date()).getTime();
                const duration = (endTime - startTime) / 1000; // ثواني
                const bitsLoaded = downloadSize * 8;
                const speedBps = bitsLoaded / duration;
                const speedMbps = (speedBps / (1024*1024)).toFixed(2);
                
                resultEl.textContent = speedMbps;
                bar.style.width = "100%";
                status.textContent = "تم القياس فعلياً";
                bar.classList.remove('bg-green-500');
                bar.classList.add('bg-primary');
            }

            download.onerror = function () {
                status.textContent = "فشل الاتصال بالسيرفر";
                bar.style.width = "0%";
            }

            download.src = imageAddr + cacheBuster;
            
            // محاكاة بصرية أثناء الانتظار الحقيقي
            let fakeProgress = 10;
            const timer = setInterval(() => {
                if(fakeProgress < 90 && status.textContent !== "تم القياس فعلياً") {
                    fakeProgress += 5;
                    bar.style.width = fakeProgress + "%";
                } else {
                    clearInterval(timer);
                }
            }, 100);
        }

        // --- 4. Real Link Cleaner Logic (Regex) ---
        function cleanLinkReal() {
            const input = document.getElementById('dirty-link');
            let url = input.value;
            
            if(!url) return;

            // كود تنظيف حقيقي باستخدام Regex
            // يزيل utm_source, ref, share_id, إلخ
            try {
                const urlObj = new URL(url);
                // الاحتفاظ فقط بالمعلمات الأساسية وحذف التتبع
                const paramsToRemove = ['utm_source', 'utm_medium', 'utm_campaign', 'si', 'igsh', 'ref', 'feature'];
                paramsToRemove.forEach(p => urlObj.searchParams.delete(p));
                
                input.value = urlObj.toString();
                // وميض للنجاح
                input.classList.add('bg-green-100', 'dark:bg-green-900');
                setTimeout(() => input.classList.remove('bg-green-100', 'dark:bg-green-900'), 500);
            } catch (e) {
                // Fallback بسيط
                input.value = url.split('?')[0];
            }
        }

        function copyCleanLink() {
            const input = document.getElementById('dirty-link');
            input.select();
            document.execCommand('copy');
            alert('تم نسخ الرابط النظيف');
        }

        // --- 5. Real Hashtag Logic ---
        function generateTagsReal() {
            const topic = document.getElementById('tag-topic').value.trim();
            const output = document.getElementById('tags-output');
            
            if(!topic) {
                output.textContent = "#اكسبلور #ترند #السعودية #مصر #fyp #foryou #viral";
                return;
            }

            // خوارزمية بسيطة لتوليد الهاشتاجات بناء على الكلمة
            const variations = [
                `#${topic}`,
                `#${topic}_جديد`,
                `#عشاق_${topic}`,
                `#عالم_${topic}`,
                `#${topic}2025`,
                '#اكسبلور',
                '#ترند',
                '#fyp'
            ];
            
            output.textContent = variations.join(' ');
        }
    </script>
</body>
</html>
